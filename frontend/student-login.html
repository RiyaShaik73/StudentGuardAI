
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | StudentGuard AI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #07111f;
            color: #eaf4ff;
            font-family: Arial, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: #101f33;
            border: 1px solid #29425e;
            border-radius: 20px;
            box-sizing: border-box;
        }
        .brand { color: #38bdf8; font-size: 14px; font-weight: bold; }
        h1 { margin-bottom: 8px; }
        .muted { color: #9db0c8; line-height: 1.6; }
        label { display: block; margin: 22px 0 8px; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #38516e;
            border-radius: 9px;
            background: #091729;
            color: white;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #38bdf8;
            color: #07111f;
            font-weight: bold;
            cursor: pointer;
        }
        a { color: #38bdf8; }
        .message { color: #fbbf24; font-size: 14px; }
        .links { margin-top: 22px; font-size: 14px; line-height: 2; }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand">✦ STUDENTGUARD AI</div>
        <h1>Welcome back</h1>
        <p class="muted">Access your academic progress and student risk insights.</p>

        <form id="loginForm">
            <label for="studentId">Student ID</label>
            <input id="studentId" name="studentId"
                   placeholder="Enter your Student ID"
                   required autocomplete="username">

            <button type="submit">View My Profile →</button>
            <p id="message" class="message" role="status"></p>
        </form>

        <div class="links">
            <a href="student-register.html">New student? Register here</a><br>
            <a href="faculty-login.html">Faculty login</a><br>
            <a href="faculty-dashboard.html">Faculty dashboard</a>
        </div>
        <p class="muted" style="font-size:12px;margin-top:20px">
            Hackathon demo: enter a Student ID present in the sample dataset.
            This page is not secure authentication.
        </p>
    </main>

    
<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const id = document.getElementById("studentId").value.trim();
    message.textContent = "Checking student record...";

    try {
        const response = await fetch(
            "http://127.0.0.1:8000/api/students/" +
            encodeURIComponent(id)
        );

        if (!response.ok) {
            message.textContent =
                "Student ID not found. Please check your dataset.";
            return;
        }

        sessionStorage.setItem("demoStudentId", id);
        window.location.href = "student-profile.html";

    } catch (error) {
        message.textContent =
            "Cannot connect to backend. Check that FastAPI is running.";
        console.error(error);
    }
});
</script>
</body>
</html>
